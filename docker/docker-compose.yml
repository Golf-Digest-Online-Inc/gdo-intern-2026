services:
  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - flask
    networks:
      - app-network
    restart: unless-stopped

  flask:
    build:
      context: ./flask
    expose:
      - "5000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/appdb
    volumes:
      - ./flask/src:/app
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
