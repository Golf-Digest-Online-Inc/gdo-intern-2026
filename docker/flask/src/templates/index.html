<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>トップページ</title>
    <link rel="icon" href="https://www.golfdigest.co.jp/favicon.ico">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.styles.css') }}">
  </head>
  <body>
    {% for item in items %}
    <div class="whole">
      <div class="item" data-id="{{ item.id }}">
        <div class="thumbnail">
          <img src="{{ url_for('static', filename=item.image) }}">
        </div>
        <div class="detail">
          <div class="name">
            <p>{{ item.name }}</p>
          </div>
          <div class="stock">
            <p>残り<span>{{ item.stock }}</span>個</p>
          </div>
        </div>
      </div>
      <div class="footer">
        <!-- <button type="button" name="buy" disabled="disabled">購入</button> -->
        <button type="button" name="buy">購入</button>
      </div>
    </div>
    {% endfor %}
    <script type="module" src="{{ url_for('static', filename='js/index.js') }}" defer></script>
  </body>
</html>
